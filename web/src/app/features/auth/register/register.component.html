<div class="auth-card">
  <h2>Kayıt Ol</h2>
  <p class="subtitle">Yeni Hesap Oluşturun</p>

  <div *ngIf="errorMessage" class="error-alert">
    {{ errorMessage }}
  </div>

  <form (ngSubmit)="onRegister()">
    <div class="form-group">
      <label for="username">Kullanıcı Adı</label>
      <input type="text" id="username" [(ngModel)]="model.fullName" name="fullName" required />
    </div>

    <div class="form-group">
      <label for="email">E-posta</label>
      <input type="email" id="email" [(ngModel)]="model.email" name="email" required />
    </div>

    <div class="form-group">
      <label for="password">Şifre</label>
      <input type="password" id="password" [(ngModel)]="model.password" name="password" required />
    </div>

    <button type="submit" [disabled]="isLoading">
      {{ isLoading ? 'Kayıt Yapılıyor...' : 'Kayıt Ol' }}
    </button>
  </form>

  <div class="auth-footer">
    <span>Zaten hesabınız var mı?</span>
    <a routerLink="/login">Giriş Yap</a>
  </div>
</div>
