@if (loading()) {
  <p>Yükleniyor...</p>
} @else {
  <table class="users-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Ad Soyad</th>
        <th>E-posta</th>
        <th>Rol</th>
      </tr>
    </thead>
    <tbody>
      @for (user of users(); track user.id) {
        <tr>
          <td>{{ user.id }}</td>
          <td>{{ user.fullName }}</td>
          <td>{{ user.email }}</td>
          <td>
            <span class="role-badge" [class.admin]="user.role === 'Admin'">
              {{ user.role }}
            </span>
          </td>
        </tr>
      }
    </tbody>
  </table>
}
