<div *ngIf="isLoading" class="loading-state">
  <p><i class="fa-solid fa-spinner fa-spin"></i> Pano yükleniyor...</p>
</div>

<!-- 1. En dış div'den cdkDropListGroup'u kaldırdık -->
<div class="board-container" *ngIf="!isLoading && boardData">
  
  <div class="board-header">
   <h2>{{ boardData.projectName }}</h2>
  </div>

  <!-- 2. cdkDropListGroup'u BURAYA (columns-wrapper) taşıdık -->
  <div 
    class="columns-wrapper" 
    cdkDropListGroup
    cdkDropList 
    cdkDropListOrientation="horizontal"
    [cdkDropListData]="boardData.columns"
    (cdkDropListDropped)="dropColumn($event)">

    <div 
      class="column-card" 
      *ngFor="let col of boardData.columns" 
      cdkDrag 
      [cdkDragData]="col">

      <!-- Kolon Başlığı -->
      <div class="column-header" cdkDragHandle>
        <ng-container *ngIf="editingColumnId !== col.id">
          <h3>{{ col.title }} <span class="task-count">({{ col.tasks.length }})</span></h3>
          
          <div class="column-actions" (click)="$event.stopPropagation()">
            <button type="button" class="btn-icon" (click)="startRenameColumn(col, $event)">✏️</button>
            <button type="button" class="btn-icon danger" (click)="deleteColumn(col.id, $event)">🗑️</button>
          </div>
        </ng-container>

        <div *ngIf="editingColumnId === col.id" class="rename-form" (click)="$event.stopPropagation()">
          <input 
            type="text" 
            [(ngModel)]="editingColumnTitle" 
            class="form-control-sm" 
            (keyup.enter)="saveRenameColumn(col.id)"
            (keyup.escape)="cancelRenameColumn()" 
            autofocus />
          <button type="button" class="btn-sm" (click)="saveRenameColumn(col.id)"><i class="fas fa-check"></i></button>
          <button type="button" class="btn-sm" (click)="cancelRenameColumn()"><i class="fas fa-times"></i></button>
        </div>
      </div>

      <!-- 🚀 GÖREV LİSTESİ (Sürükle-Bırak Alanı) -->
      <div 
        class="tasks-list" 
        cdkDropList 
        [cdkDropListData]="col.tasks" 
        (cdkDropListDropped)="drop($event, col)">
        
        <!-- GÖREV KARTI -->
        <div 
          class="task-card" 
          *ngFor="let task of col.tasks" 
          cdkDrag 
          [cdkDragData]="task"
          (click)="openTaskDetail(task)">
          
          <div class="task-title">{{ task.title }}</div>
          
          <div class="task-footer">
            <span class="badge" [ngClass]="'priority-' + task.priority.toLowerCase()">
              {{ task.priority }}
            </span>

            <div class="right-info">
              <span 
                *ngIf="task.dueDate" 
                class="due-date" 
                [class.overdue]="isOverdue(task.dueDate)">
                📅 {{ task.dueDate | date:'dd MMM' }}
              </span>

              <div *ngIf="task.assigneeName" class="avatar">
                {{ getInitials(task.assigneeName) }}
              </div>
            </div>
          </div>

        </div>

      </div>

      <!-- HIZLI GÖREV EKLEME -->
      <div class="add-task-section" (click)="$event.stopPropagation()">
        <button 
          *ngIf="activeColumnIdForNewTask !== col.id" 
          class="btn-add-task" 
          (click)="toggleNewTaskForm(col.id)">
          + Görev Ekle
        </button>

        <div *ngIf="activeColumnIdForNewTask === col.id" class="quick-task-form">
          <input 
            type="text" 
            [(ngModel)]="newTaskTitle" 
            placeholder="Görev başlığı..." 
            (keyup.enter)="addTask(col)"
            autofocus />
          
          <select [(ngModel)]="newTaskPriority" class="select-priority">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>

          <div class="form-actions">
            <button type="button" class="btn-save" (click)="addTask(col)">Ekle</button>
            <button type="button" class="btn-cancel" (click)="toggleNewTaskForm(col.id)">İptal</button>
          </div>
        </div>
      </div>

    </div>

    <!-- YENİ KOLON EKLEME BUTONU -->
    <div class="add-column-wrapper">
      <button *ngIf="!isAddingColumn" class="btn-add-column" (click)="toggleAddColumnForm()">
        + Kolon Ekle
      </button>

      <div *ngIf="isAddingColumn" class="add-column-card">
        <input 
          type="text" 
          [(ngModel)]="newColumnTitle" 
          placeholder="Kolon başlığı..." 
          (keyup.enter)="addColumn()" 
          autofocus />
        <div class="form-actions">
          <button type="button" class="btn-save" (click)="addColumn()">Ekle</button>
          <button type="button" class="btn-cancel" (click)="toggleAddColumnForm()">İptal</button>
        </div>
      </div>
    </div>

  </div>

</div>

<!-- TASK DETAIL DIALOG -->
<app-task-detail-dialog
  *ngIf="isDetailModalOpen && selectedTask"
  [task]="selectedTask"
  [members]="projectMembers"
  [isOpen]="isDetailModalOpen"
  (close)="closeTaskDetail()"
  (save)="saveTaskDetail($event)"
  (delete)="deleteTaskDetail($event)">
</app-task-detail-dialog>
