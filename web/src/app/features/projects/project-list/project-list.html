<div class="project-list-container">
  <h1>Projelerim</h1>

  <button mat-raised-button color="primary" (click)="openCreateDialog()">
  + Yeni Proje
  </button>
  

  @if (loading()) {
    <p>Yükleniyor...</p>
  } @else if (projects().length === 0) {
    <p>Henüz projen yok.</p>
  } @else {
    <div class="project-grid">
      @for (project of projects(); track project.id) {
        <div class="project-card">
          <h3>{{ project.name }}</h3>
          <p>{{ project.description }}</p>
          <small>Sahibi: {{ project.ownerName }} · {{ project.memberCount }} üye</small>
          <button mat-button color="warn" (click)="deleteProject(project.id, $event)">Sil</button>
        </div>
      }
    </div>
  }
</div>
